name: Export Ekran TV full website source
on:
  push:
    branches: [ekrantv-android-apk-test-20261107]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and bundle website source
        run: |
          test -f index.html
          test -f admin.html
          test -f js/app.js
          test -f js/tv-player.js
          test -f js/iptv-local.js
          test -f data/films.js
          test -f data/channels.js
          test -f data/uz_channels.js
          python3 - <<'PY'
          import os,zipfile
          dest='/tmp/Ekran-TV-toliq-sayt-kodi.zip'
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for root,dirs,files in os.walk('.'):
                  dirs[:]=[d for d in dirs if d not in {'.git','.github','node_modules'}]
                  for name in files:
                      path=os.path.join(root,name)
                      if path.startswith('./'): path=path[2:]
                      if path.endswith(('.m3u','.m3u8','.apk')): continue
                      z.write(path,'ekran-tv/'+path)
          print(dest,os.path.getsize(dest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Ekran-TV-Toliq-Sayt-Kodi
          path: /tmp/Ekran-TV-toliq-sayt-kodi.zip
          if-no-files-found: error
